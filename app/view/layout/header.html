<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{$site_name|default='数据标注平台'}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-dark: #4f46e5;
            --secondary-color: #64748b;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --light-bg: #f8fafc;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --gradient-primary: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--light-bg);
            color: #334155;
        }

        .navbar {
            background: var(--gradient-primary);
            box-shadow: var(--card-shadow);
            padding: 0.75rem 0;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            color: #fff !important;
        }

        .navbar-brand i {
            margin-right: 0.5rem;
        }

        .navbar-nav .nav-link {
            color: rgba(255, 255, 255, 0.9) !important;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            margin: 0 0.25rem;
            transition: all 0.3s ease;
        }

        .navbar-nav .nav-link:hover,
        .navbar-nav .nav-link.active {
            background-color: rgba(255, 255, 255, 0.15);
            color: #fff !important;
        }

        .navbar .dropdown-menu {
            border: none;
            box-shadow: var(--card-shadow);
            border-radius: 0.75rem;
            padding: 0.5rem;
        }

        .navbar .dropdown-item {
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
        }

        .navbar .dropdown-item:hover {
            background-color: var(--light-bg);
        }

        .hero-section {
            background: var(--gradient-primary);
            padding: 4rem 0;
            color: #fff;
        }

        .hero-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .hero-subtitle {
            font-size: 1.125rem;
            opacity: 0.9;
            margin-bottom: 2rem;
        }

        .btn-primary {
            background: var(--gradient-primary);
            border: none;
            padding: 0.75rem 2rem;
            font-weight: 600;
            border-radius: 0.75rem;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .btn-outline-primary {
            border-color: var(--primary-color);
            color: var(--primary-color);
            border-width: 2px;
            font-weight: 600;
            border-radius: 0.75rem;
        }

        .btn-outline-primary:hover {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .card-header {
            background-color: #fff;
            border-bottom: 1px solid #e2e8f0;
            border-radius: 1rem 1rem 0 0 !important;
            padding: 1rem 1.5rem;
        }

        .card-body {
            padding: 1.5rem;
        }

        .task-card {
            cursor: pointer;
        }

        .task-card .price-badge {
            background: var(--gradient-primary);
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: 700;
            font-size: 1.25rem;
        }

        .task-card .task-title {
            font-weight: 600;
            font-size: 1.125rem;
            color: #1e293b;
            margin-bottom: 0.75rem;
        }

        .task-card .task-meta {
            color: var(--secondary-color);
            font-size: 0.875rem;
        }

        .task-card .task-tags {
            margin-top: 0.75rem;
        }

        .task-card .tag {
            display: inline-block;
            background-color: #eef2ff;
            color: var(--primary-color);
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 500;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .form-control, .form-select {
            border-radius: 0.75rem;
            border: 2px solid #e2e8f0;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .form-label {
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }

        .alert {
            border-radius: 0.75rem;
            border: none;
        }

        .alert-success {
            background-color: #dcfce7;
            color: #166534;
        }

        .alert-danger {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .alert-warning {
            background-color: #fef3c7;
            color: #92400e;
        }

        .alert-info {
            background-color: #dbeafe;
            color: #1e40af;
        }

        .badge {
            font-weight: 500;
            padding: 0.5em 0.75em;
            border-radius: 0.5rem;
        }

        .badge-primary {
            background-color: #eef2ff;
            color: var(--primary-color);
        }

        .badge-success {
            background-color: #dcfce7;
            color: #166534;
        }

        .badge-warning {
            background-color: #fef3c7;
            color: #92400e;
        }

        .badge-danger {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .page-header {
            background: var(--gradient-primary);
            padding: 2rem 0;
            color: #fff;
            margin-bottom: 2rem;
        }

        .page-title {
            font-size: 2rem;
            font-weight: 700;
            margin: 0;
        }

        .nav-tabs {
            border-bottom: 2px solid #e2e8f0;
        }

        .nav-tabs .nav-link {
            border: none;
            color: var(--secondary-color);
            font-weight: 600;
            padding: 1rem 1.5rem;
            margin-bottom: -2px;
        }

        .nav-tabs .nav-link.active {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            background-color: transparent;
        }

        .modal-content {
            border-radius: 1rem;
            border: none;
        }

        .modal-header {
            border-bottom: 1px solid #e2e8f0;
            padding: 1.5rem;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .modal-footer {
            border-top: 1px solid #e2e8f0;
            padding: 1.5rem;
        }

        .stats-card {
            text-align: center;
            padding: 2rem;
        }

        .stats-card .stats-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .stats-card .stats-label {
            font-size: 0.875rem;
            color: var(--secondary-color);
            margin-top: 0.5rem;
        }

        .comment-item {
            padding: 1rem 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .comment-item:last-child {
            border-bottom: none;
        }

        .comment-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 1.25rem;
        }

        .comment-content {
            margin-left: 1rem;
            flex: 1;
        }

        .comment-author {
            font-weight: 600;
            color: #1e293b;
        }

        .comment-time {
            font-size: 0.75rem;
            color: var(--secondary-color);
            margin-left: 0.5rem;
        }

        .comment-text {
            margin-top: 0.5rem;
            color: #475569;
        }

        .qrcode-container {
            text-align: center;
            padding: 2rem;
        }

        .qrcode-container .qrcode-img {
            max-width: 250px;
            border-radius: 1rem;
            box-shadow: var(--card-shadow);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
        }

        .empty-state i {
            font-size: 4rem;
            color: #cbd5e1;
            margin-bottom: 1rem;
        }

        .empty-state h4 {
            color: #64748b;
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            color: #94a3b8;
        }

        .search-box {
            position: relative;
        }

        .search-box .form-control {
            padding-left: 3rem;
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .footer {
            background-color: #1e293b;
            color: #94a3b8;
            padding: 3rem 0;
            margin-top: 4rem;
        }

        .footer-title {
            color: #fff;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .footer-links a {
            color: #94a3b8;
            display: block;
            margin-bottom: 0.5rem;
            text-decoration: none;
        }

        .footer-links a:hover {
            color: #fff;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            font-size: 0.875rem;
            margin-right: 0.5rem;
        }

        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: #ef4444;
            color: #fff;
            font-size: 0.625rem;
            padding: 0.125rem 0.375rem;
            border-radius: 1rem;
            min-width: 18px;
            text-align: center;
        }

        .toast-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 9999;
        }

        .toast {
            border-radius: 0.75rem;
            border: none;
            box-shadow: var(--card-shadow);
        }

        .toast-success {
            background-color: #dcfce7;
            color: #166534;
        }

        .toast-error {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .toast-warning {
            background-color: #fef3c7;
            color: #92400e;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-grid-3x3-gap-fill"></i>
                数据标注平台
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {if $Request.pathinfo() == ''}active{/if}" href="/">
                            <i class="bi bi-house-door"></i> 首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {if strpos($Request.pathinfo(), 'task') !== false}active{/if}" href="/task">
                            <i class="bi bi-briefcase"></i> 任务广场
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {if strpos($Request.pathinfo(), 'faq') !== false}active{/if}" href="/faq">
                            <i class="bi bi-question-circle"></i> FAQ
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    {if isset($user)}
                        <li class="nav-item">
                            <a class="nav-link {if strpos($Request.pathinfo(), 'user/my-tasks') !== false}active{/if}" href="/user/my-tasks">
                                <i class="bi bi-list-check"></i> 我参与的
                            </a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                                <div class="user-avatar">
                                    {$user.nickname|mb_substr=0,1|strtoupper}
                                </div>
                                <span>{$user.nickname}</span>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <a class="dropdown-item {if strpos($Request.pathinfo(), 'user/center') !== false}active{/if}" href="/user/center">
                                        <i class="bi bi-person-circle"></i> 个人中心
                                    </a>
                                </li>
                                <li>
                                    <a class="dropdown-item {if strpos($Request.pathinfo(), 'user/earnings') !== false}active{/if}" href="/user/earnings">
                                        <i class="bi bi-wallet2"></i> 收益明细
                                    </a>
                                </li>
                                <li>
                                    <a class="dropdown-item {if strpos($Request.pathinfo(), 'user/profile') !== false}active{/if}" href="/user/profile">
                                        <i class="bi bi-person-lines-fill"></i> 完善资料
                                    </a>
                                </li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <a class="dropdown-item text-danger" href="/logout">
                                        <i class="bi bi-box-arrow-right"></i> 退出登录
                                    </a>
                                </li>
                            </ul>
                        </li>
                    {else}
                        <li class="nav-item">
                            <a class="nav-link" href="/login">
                                <i class="bi bi-box-arrow-in-right"></i> 登录
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/register">
                                <i class="bi bi-person-plus"></i> 注册
                            </a>
                        </li>
                    {/if}
                </ul>
            </div>
        </div>
    </nav>
