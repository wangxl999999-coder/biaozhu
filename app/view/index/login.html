{include file="layout/header" /}

<div class="page-header">
    <div class="container">
        <div class="row">
            <div class="col-12">
                <h1 class="page-title">用户登录</h1>
            </div>
        </div>
    </div>
</div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-box-arrow-in-right" style="font-size: 3rem; color: var(--primary-color);"></i>
                        <h4 class="mt-3">欢迎回来</h4>
                        <p class="text-muted">登录您的账号开始做任务</p>
                    </div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">用户名</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-person"></i>
                                </span>
                                <input type="text" class="form-control" name="username" placeholder="请输入用户名" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">密码</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-lock"></i>
                                </span>
                                <input type="password" class="form-control" name="password" placeholder="请输入密码" required>
                            </div>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-box-arrow-in-right"></i> 登录
                            </button>
                        </div>
                    </form>

                    <hr>

                    <div class="text-center">
                        <p class="text-muted mb-0">还没有账号？</p>
                        <a href="/register" class="text-decoration-none">
                            立即注册 <i class="bi bi-arrow-right"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    
    axios.post('/login', formData)
        .then(function(response) {
            if (response.data.code === 1) {
                showToast(response.data.msg, 'success');
                setTimeout(function() {
                    window.location.href = response.data.data.redirect || '/';
                }, 1000);
            } else {
                showToast(response.data.msg, 'error');
            }
        })
        .catch(function(error) {
            showToast('登录失败，请重试', 'error');
        });
});
</script>

{include file="layout/footer" /}
